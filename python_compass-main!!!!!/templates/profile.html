<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang-key="pageTitle">Личный кабинет — Пайтон-компас</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
    <style>
        .profile-container {
            min-height: 100vh;
            padding: 40px 20px;
            background: var(--bg-light);
        }
        .profile-card {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 40px;
        }
        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border);
        }
        .profile-header h1 {
            color: var(--text);
            font-size: 24px;
        }
        .profile-info {
            margin-bottom: 30px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid var(--border);
        }
        .info-label {
            color: var(--text-muted);
            font-weight: 500;
        }
        .info-value {
            color: var(--text);
            font-weight: 600;
        }
        .profile-edit h2 {
            color: var(--text);
            font-size: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text);
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            background: var(--bg-light);
            color: var(--text);
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .form-group input:disabled {
            background: var(--border);
            cursor: not-allowed;
        }
        .btn-save {
            padding: 14px 30px;
            background: var(--btn-bg);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }
        .success-message {
            background: rgba(0, 184, 148, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <h1 class="site-title">
                <span class="logo">🧭</span>
                <span data-lang-key="siteTitle">Пайтон-компас</span>
            </h1>
            <div class="header-controls">
                <a href="/" class="btn-back" id="btn-home" data-lang-key="backHome">На главную</a>
                <select class="lang-select" id="lang-select">
                    <option value="ru">Русский</option>
                    <option value="en">English</option>
                </select>
            </div>
        </div>
    </header>
    
    <div class="profile-container">
        <div class="profile-card">
            <div class="profile-header">
                <h1 data-lang-key="title">Личный кабинет</h1>
                <a href="/logout" class="btn-logout" id="btn-logout" data-lang-key="logout">Выйти</a>
            </div>
            
            <div class="success-message" id="success-message" data-lang-key="successMessage">Данные успешно сохранены!</div>
            
            <div class="profile-info">
                <div class="info-row">
                    <span class="info-label" data-lang-key="email">Email</span>
                    <span class="info-value" id="user-email">{{ current_user.email }}</span>
                </div>
                <div class="info-row">
                    <span class="info-label" data-lang-key="name">Имя</span>
                    <span class="info-value" id="user-name">{{ current_user.name }}</span>
                </div>
                <div class="info-row">
                    <span class="info-label" data-lang-key="surname">Фамилия</span>
                    <span class="info-value" id="user-surname">{{ current_user.surname }}</span>
                </div>
                <div class="info-row">
                    <span class="info-label" data-lang-key="classLabel">Класс</span>
                    <span class="info-value" id="user-class">{{ current_user.class_name or '—' }}</span>
                </div>
            </div>
            
            <div class="profile-edit">
                <h2 data-lang-key="editTitle">Редактировать данные</h2>
                <form id="profile-form">
                    <div class="form-group">
                        <label for="edit-name" data-lang-key="nameLabel">Имя</label>
                        <input type="text" id="edit-name" value="{{ current_user.name }}">
                    </div>
                    <div class="form-group">
                        <label for="edit-surname" data-lang-key="surnameLabel">Фамилия</label>
                        <input type="text" id="edit-surname" value="{{ current_user.surname }}">
                    </div>
                    <div class="form-group">
                        <label for="edit-class" data-lang-key="classLabelInput">Класс</label>
                        <input type="text" id="edit-class" value="{{ current_user.class_name or '' }}">
                    </div>
                    <div class="form-group">
                        <label for="edit-email" data-lang-key="emailLabel">Email (нельзя изменить)</label>
                        <input type="email" value="{{ current_user.email }}" disabled>
                    </div>
                    <button type="submit" class="btn-save" data-lang-key="save">Сохранить</button>
                </form>
            </div>
        </div>
    </div>
    
    <script>
        const profileTranslations = {
            ru: {
                siteTitle: "Пайтон-компас",
                pageTitle: "Личный кабинет — Пайтон-компас",
                title: "Личный кабинет",
                logout: "Выйти",
                backHome: "На главную",
                about: "О разработчике",
                successMessage: "Данные успешно сохранены!",
                email: "Email",
                name: "Имя",
                surname: "Фамилия",
                classLabel: "Класс",
                editTitle: "Редактировать данные",
                nameLabel: "Имя",
                surnameLabel: "Фамилия",
                classLabelInput: "Класс",
                emailLabel: "Email (нельзя изменить)",
                save: "Сохранить"
            },
            en: {
                siteTitle: "PythonCompass",
                pageTitle: "Profile — PythonCompass",
                title: "Profile",
                logout: "Logout",
                backHome: "Home",
                about: "About",
                successMessage: "Data saved successfully!",
                email: "Email",
                name: "Name",
                surname: "Surname",
                classLabel: "Class",
                editTitle: "Edit data",
                nameLabel: "Name",
                surnameLabel: "Surname",
                classLabelInput: "Class",
                emailLabel: "Email (cannot be changed)",
                save: "Save"
            }
        };

        let currentLang = localStorage.getItem('lang') || 'ru';
        
        function applyProfileLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            const t = profileTranslations[lang];
            document.querySelectorAll('[data-lang-key]').forEach(el => {
                const key = el.getAttribute('data-lang-key');
                if (t[key]) {
                    el.textContent = t[key];
                }
            });
        }

        document.getElementById('lang-select').value = currentLang;
        document.getElementById('lang-select').addEventListener('change', (e) => {
            applyProfileLanguage(e.target.value);
        });

        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('edit-name').value;
            const surname = document.getElementById('edit-surname').value;
            const class_name = document.getElementById('edit-class').value;
            
            const response = await fetch('/update_profile', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name, surname, class_name})
            });
            
            const data = await response.json();
            if (data.success) {
                document.getElementById('user-name').textContent = name;
                document.getElementById('user-surname').textContent = surname;
                document.getElementById('user-class').textContent = class_name || '—';
                document.getElementById('success-message').classList.add('show');
                setTimeout(() => {
                    document.getElementById('success-message').classList.remove('show');
                }, 3000);
            }
        });

        applyProfileLanguage(currentLang);
    </script>
</body>
</html>
